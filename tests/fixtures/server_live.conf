port 11944
proto tcp
dev tun
ca /etc/openvpn/keys/ca.crt
cert /etc/openvpn/keys/server.crt
key /etc/openvpn/keys/server.key
dh /etc/openvpn/keys/dh.pem
tls-crypt /etc/openvpn/keys/ta.key 0
cipher AES-256-GCM
auth SHA384
data-ciphers AES-256-GCM:CHACHA20-POLY1305:AES-128-GCM
tls-version-min 1.3
tls-version-max 1.3
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
tls-cipher TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-RSA-WITH-CHACHA20-POLY1305-SHA256
keepalive 10 60
persist-key
persist-tun
user nobody
group nogroup
status /var/log/openvpn-status.log
log-append /var/log/openvpn.log
verb 3
explicit-exit-notify 0
verify-client-cert none
username-as-common-name
duplicate-cn
plugin /usr/lib/openvpn/openvpn-plugin-auth-pam.so login
server 10.8.0.0 255.255.255.0
topology subnet
push "redirect-gateway def1 bypass-dhcp"
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 1.0.0.1"
push "block-ipv6"
push "block-outside-dns"
push "register-dns"
# TCP optimizations for large transfers
sndbuf 524288
rcvbuf 524288
push "sndbuf 524288"
push "rcvbuf 524288"
# Security hardening
reneg-sec 3600
crl-verify /etc/openvpn/keys/crl.pem
# Prevent fingerprinting - mssfix works with TCP
mssfix 1360
tun-mtu 1400
push "tun-mtu 1400"
push "mssfix 1360"
# Disable compression (security)
# compress lz4-v2
# push "compress lz4-v2"
