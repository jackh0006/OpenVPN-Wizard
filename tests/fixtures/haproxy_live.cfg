# GooseForge managed GooseRelayVPN
frontend goose_tls_in
    bind *:8443 ssl crt /etc/haproxy/certs/g.mhhdns.online.pem
    mode http
    default_backend goose_back

backend goose_back
    mode http
    server goose 127.0.0.1:9444
