global
	log /dev/log	local0
	log /dev/log	local1 notice
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
	stats timeout 30s
	user haproxy
	group haproxy
	daemon

	ca-base /etc/ssl/certs
	crt-base /etc/ssl/private

	ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
	ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
	ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
	log	global
	mode	tcp
	option	dontlognull
	option	log-health-checks
	timeout connect 10s
	timeout client 120s
	timeout server 120s
	timeout tunnel 300s

# Port 443: VLESS/OpenVPN (TCP pass-through with SNI routing)
frontend unified_443
    bind *:443
    mode tcp
    log global
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    
    use_backend bk_ovpn if { req.ssl_sni -i ovpn.mhhdns.online }
    use_backend bk_10010 if { req.ssl_sni -i cloudflare.com }
    use_backend bk_10000 if { req.ssl_sni -i cloud.mhhdns.online }
    use_backend bk_10001 if { req.ssl_sni -i cflare.mhhdns.online }
    use_backend bk_10002 if { req.ssl_sni -i cloudf.mhhdns.online }
    use_backend bk_10003 if { req.ssl_sni -i api.mhhdns.online }
    use_backend bk_10004 if { req.ssl_sni -i cloudx.mhhdns.online }
    use_backend bk_10004 if { req.ssl_sni -i cloudx.mhhdns.online }
    use_backend bk_10005 if { req.ssl_sni -i irancloud.mhhdns.online }
    use_backend bk_10006 if { req.ssl_sni -i h7.example.com }
    use_backend bk_10007 if { req.ssl_sni -i h8.example.com }
    use_backend bk_10007 if { req.ssl_sni -i h8.example.com }
    use_backend bk_10008 if { req.ssl_sni -i h9.example.com }
    use_backend bk_10009 if { req.ssl_sni -i h10.example.com }
    default_backend bk_ovpn

# Port 8443: Veilway Panel (HTTPS with TLS termination)
frontend veilway_https
    bind *:8443 ssl crt /etc/haproxy/certs/vcloud.mhhdns.online.pem
    mode http
    log global
    option httplog
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-For %[src]
    default_backend bk_veilway

backend bk_veilway
    mode http
    log global
    option httplog
    timeout server 120s
    timeout tunnel 300s
    option httpchk GET /6bb5b5de76010605/ HTTP/1.1\r\nHost:\ vcloud.mhhdns.online
    http-check expect status 200
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-For %[src]
    server s_veilway 127.0.0.1:8480 check inter 10s fall 3 rise 2

backend bk_ovpn
    mode tcp
    timeout server 120s
    timeout tunnel 300s
    server s_ovpn 127.0.0.1:11944

