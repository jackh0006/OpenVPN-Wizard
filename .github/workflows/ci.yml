name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn haproxy easy-rsa openssh-client
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile all Python
        run: python -m compileall -q core management steps ui utils validation cli.py
      - name: Run tests
        run: pytest -q
      - name: Render a dry-run plan
        run: |
          vpn-installer plan --output /tmp/vpn-plan --profiles 3 --access free
          vpn-installer plan --output /tmp/vpn-plan-locked --proto udp --access locked --auth cert
          test -s /tmp/vpn-plan/server.conf
          test -s /tmp/vpn-plan-locked/clients/MHH06-01.ovpn
      - name: Verify OpenVPN parses generated configs
        run: |
          openvpn --config /tmp/vpn-plan/server.conf --show-gateway
          openvpn --config /tmp/vpn-plan/clients/MHH06-01.ovpn --show-gateway

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax
        run: bash -n install.sh quick_install.sh openvpn-wizard-linux.sh openvpn-wizard-termux.sh scripts/download-ovpn.sh
      - name: ShellCheck (errors only)
        run: shellcheck -S error install.sh quick_install.sh openvpn-wizard-linux.sh openvpn-wizard-termux.sh scripts/download-ovpn.sh

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Static security scan
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r core management steps ui utils validation cli.py -lll
