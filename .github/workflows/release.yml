name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e '.[dev]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn haproxy easy-rsa

      - name: Test before release
        run: |
          pytest -q
          python -m compileall -q core management steps ui utils validation cli.py
          bash -n install.sh quick_install.sh openvpn-wizard-linux.sh openvpn-wizard-termux.sh scripts/download-ovpn.sh

      - name: Build package
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
