# OpenVPN Wizard v2 - safe systemd hardening drop-in.
# Installed as /etc/systemd/system/openvpn@.service.d/10-openvpn-wizard.conf
# It intentionally stays compatible with the stock Ubuntu unit and keeps
# /var/log/openvpn writable for OpenVPN's own log/status files.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=full
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
RemoveIPC=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
ReadWritePaths=/var/log/openvpn /var/lib/openvpn /run/openvpn
